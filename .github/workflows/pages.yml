name: pages

# Publishes this repo's main branch to GitHub Pages
# (Settings -> Pages -> Source = "GitHub Actions").
# The Peace Walker checklist lives at /peace-walker/.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp -R peace-walker _site/
          cat > _site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>Xorbret</title>
          <meta http-equiv="refresh" content="0; url=peace-walker/">
          <a href="peace-walker/">Peace Walker Endgame Checklist</a>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
