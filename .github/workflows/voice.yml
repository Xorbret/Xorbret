name: voice

# Checks the Mitama's retraining kit end to end on a CPU: builds the training
# text (downloads the public-domain sources), runs a tiny training, exports
# model.bin, checks it against the device's maths, and samples from it. The
# real training runs on a GPU (see mitamaos/voice/README.md).

on:
  push:
    branches: [ "claude/cardputer-adv-os-firmware-okqopr" ]
    paths:
      - "mitamaos/voice/**"
      - "mitamaos/firmware/src/mitama/lines.h"
      - ".github/workflows/voice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mitamaos/voice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Build training text
        run: python build_corpus.py
      - name: Tiny training run
        run: python train.py --pretrain-steps 40 --finetune-steps 20 --batch 8 --log-every 10 --preview-every 0
      - name: Check export against the device maths
        run: python check_export.py out/mitama.pt out/model.bin
      - name: Sample like the device
        run: python modelbin.py out/model.bin -n 1 --prompt "Q: who are you?\nA:" --prompt "Q: *idle*\nA:"
      - name: Corpus summary
        run: |
          ls -la data out
          head -c 400 data/voice.txt
