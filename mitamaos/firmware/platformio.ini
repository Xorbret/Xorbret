; MitamaOS - M5Cardputer ADV (ESP32-S3FN8, 8MB Flash, NO PSRAM)
;
; Built on the PaperOS core (GPLv2) by Artem76228 - see CREDITS.md.
; The M5Cardputer library is pinned to >=1.1.1: that is the first release
; with native M5Cardputer ADV support (TCA8418 I2C keypad @ 0x34 via its
; built-in TCA8418KeyboardReader). The pre-ADV 1.0.x line used the original
; GPIO key-matrix and reboot-loops on ADV hardware.
[env:mitamaos-cardputer-adv]
platform  = espressif32 @ 6.7.0
board     = m5stack-stamps3
framework = arduino

board_build.flash_mode      = qio
board_build.flash_freq      = 80m
board_build.flash_size      = 8MB
board_build.partitions      = mitamaos_8mb.csv
board_build.filesystem      = littlefs

board_build.mcu     = esp32s3
board_build.f_cpu   = 240000000L

build_flags =
    -DESP32S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17
    -Wno-unused-variable
    -Wno-unused-function
    -Wno-deprecated-declarations
    -DLUA_USE_ESP32
    ; Bluetooth is receive-only by construction: NimBLE keeps only the
    ; observer (scanner) role, so the code to advertise or connect isn't built.
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    ; crash recorder (src/system/crash_log.cpp) hooks the panic handler
    -Wl,--wrap=esp_panic_handler

build_unflags =
    -std=gnu++11
    -std=gnu++14

upload_speed   = 1500000
monitor_speed  = 115200
upload_protocol = esptool

lib_deps =
    m5stack/M5Cardputer @ ^1.1.1
    m5stack/M5Unified @ ^0.2.2
    earlephilhower/ESP8266Audio @ 1.9.7
    h2zero/NimBLE-Arduino @ 1.4.3
    jgromes/RadioLib @ 6.6.0
